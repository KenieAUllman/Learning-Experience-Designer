<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#163A2F" />

  <title>Page Not Found | McKena Ullman</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/components.css" />
  <script src="js/main.js" defer></script>

  <style>
    .notfound {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background:
        linear-gradient(rgba(20,33,28,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(20,33,28,0.035) 1px, transparent 1px),
        var(--warm-ivory);
      background-size: 32px 32px;
    }

    .notfound-card {
      width: min(100%, 880px);
      padding: clamp(2rem, 6vw, 4.5rem);
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.84);
      text-align: center;
      box-shadow: 0 24px 70px rgba(20,33,28,0.06);
    }

    .notfound-code {
      display: block;
      margin-bottom: 1rem;
      color: var(--warm-brass);
      font-family: var(--font-serif);
      font-size: clamp(4rem, 11vw, 8rem);
      line-height: 0.9;
    }

    .notfound h1 {
      max-width: 14ch;
      margin-inline: auto;
      margin-bottom: 1.2rem;
      font-size: clamp(2.4rem, 6vw, 4.5rem);
    }

    .notfound p {
      max-width: 560px;
      margin: 0 auto 1.6rem;
      color: var(--muted-ink);
      font-size: 1.05rem;
    }
  </style>
</head>

<body>
  <main class="notfound">
    <section class="notfound-card">
      <span class="notfound-code">404</span>
      <p class="eyebrow">Page Not Found</p>

      <h1>This page got lost somewhere between Diagnose and Design.</h1>

      <p>
        The link may have moved, or the page may not exist yet. Either way, the cleanest path is back to the beginning.
      </p>

      <a class="button button--primary" href="index.html">Return Home</a>
    </section>
  </main>
</body>
</html>
