<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,follow" />
  <title>Workforce Training Analytics Workbook | McKena Ullman</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root{
      --dark:#131a11;
      --dark-2:#1a2418;
      --dark-3:#222e20;
      --paper:#f5f1e7;
      --paper-2:#fffdf8;
      --ink:#14211c;
      --muted:#667069;
      --gold:#aa9951;
      --peach:#e89a78;
      --line-dark:rgba(255,255,255,.13);
      --line:#d9d5ca;
      --grid:#e6e2d8;
      --sans:"Manrope",system-ui,sans-serif;
      --serif:"Source Serif 4",Georgia,serif;
    }
    *{box-sizing:border-box}
    html,body{min-height:100%}
    body{
      margin:0;
      background:var(--dark);
      color:var(--ink);
      font-family:var(--sans);
      line-height:1.45;
    }
    button,a{font:inherit}
    .shell{
      width:min(100%,1600px);
      margin:0 auto;
      padding:20px;
    }
    .workbook{
      border:1px solid var(--line-dark);
      background:var(--dark-2);
      box-shadow:0 20px 60px rgba(0,0,0,.18);
    }
    .workbook-top{
      display:flex;
      justify-content:space-between;
      gap:24px;
      align-items:flex-start;
      padding:20px 22px 18px;
      border-bottom:1px solid var(--line-dark);
      background:
        radial-gradient(circle at 12% 20%, rgba(170,153,81,.09), transparent 26%),
        var(--dark-2);
      color:#fff;
    }
    .workbook-kicker{
      margin:0 0 5px;
      color:var(--gold);
      font-size:.66rem;
      font-weight:700;
      letter-spacing:.18em;
      text-transform:uppercase;
    }
    .workbook-top h1{
      margin:0;
      font-family:var(--serif);
      font-size:clamp(1.35rem,2.8vw,2rem);
      font-weight:600;
      line-height:1.1;
    }
    .workbook-meta{
      display:flex;
      flex-wrap:wrap;
      justify-content:flex-end;
      gap:8px 18px;
      color:#c9d0c8;
      font-size:.7rem;
      font-weight:600;
      letter-spacing:.08em;
      text-transform:uppercase;
      text-align:right;
    }
    .workbook-meta span:first-child{color:var(--peach)}
    .sheet-tabs{
      display:flex;
      overflow-x:auto;
      scrollbar-width:thin;
      border-bottom:1px solid var(--line-dark);
      background:var(--dark);
    }
    .sheet-tab{
      position:relative;
      flex:0 0 auto;
      min-height:46px;
      padding:0 16px;
      border:0;
      border-right:1px solid var(--line-dark);
      background:transparent;
      color:#aeb7af;
      cursor:pointer;
      font-size:.74rem;
      font-weight:600;
      white-space:nowrap;
    }
    .sheet-tab:hover{
      color:#fff;
      background:rgba(255,255,255,.025);
    }
    .sheet-tab.is-active{
      color:#fff;
      background:var(--dark-2);
    }
    .sheet-tab.is-active::after{
      content:"";
      position:absolute;
      left:14px;
      right:14px;
      bottom:-1px;
      height:2px;
      background:var(--peach);
    }
    .sheet-toolbar{
      display:flex;
      justify-content:space-between;
      gap:20px;
      align-items:center;
      padding:10px 14px;
      border-bottom:1px solid var(--line);
      background:#ebe6da;
    }
    .sheet-title{
      display:flex;
      gap:12px;
      align-items:baseline;
      min-width:0;
    }
    .sheet-title strong{
      overflow:hidden;
      color:var(--ink);
      font-family:var(--serif);
      font-size:1rem;
      font-weight:600;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .sheet-title span,
    .sheet-status{
      color:var(--muted);
      font-size:.7rem;
      font-weight:600;
    }
    .sheet-status{
      flex:0 0 auto;
      text-align:right;
    }
    .sheet-stage{
      position:relative;
      min-height:680px;
      max-height:900px;
      overflow:auto;
      background:var(--paper-2);
    }
    .loading,.error{
      display:grid;
      place-items:center;
      min-height:500px;
      padding:40px;
      color:var(--muted);
      font-family:var(--serif);
      font-size:1.1rem;
      text-align:center;
    }
    .error strong{
      display:block;
      margin-bottom:8px;
      color:#914f39;
      font-family:var(--sans);
    }
    .grid{
      border-collapse:separate;
      border-spacing:0;
      width:max-content;
      min-width:100%;
      background:var(--paper-2);
      font-size:.76rem;
    }
    .grid th,.grid td{
      min-width:92px;
      max-width:340px;
      height:31px;
      padding:6px 8px;
      border-right:1px solid var(--grid);
      border-bottom:1px solid var(--grid);
      background:#fff;
      color:#2f3933;
      overflow:hidden;
      text-overflow:ellipsis;
      vertical-align:middle;
      white-space:nowrap;
    }
    .grid .corner,
    .grid .col-head,
    .grid .row-head{
      position:sticky;
      z-index:4;
      background:#ece8de;
      color:#768078;
      font-size:.64rem;
      font-weight:700;
      text-align:center;
      user-select:none;
    }
    .grid .corner{
      top:0;
      left:0;
      z-index:7;
      min-width:48px;
      width:48px;
    }
    .grid .col-head{top:0;z-index:6}
    .grid .row-head{
      left:0;
      z-index:5;
      min-width:48px;
      width:48px;
    }
    .grid td.is-number{text-align:right;font-variant-numeric:tabular-nums}
    .grid td.is-boolean{text-align:center}
    .grid tr.data-header td{
      background:#e8eee9;
      color:#1a2a22;
      font-weight:700;
    }
    .grid tr.section-row td:not(.row-head){
      background:#f2eee5;
      color:#806f34;
      font-family:var(--serif);
      font-size:.86rem;
      font-weight:600;
    }
    .grid td.title-cell{
      color:#1c3228;
      font-family:var(--serif);
      font-size:1rem;
      font-weight:600;
    }
    .grid td:focus{
      position:relative;
      outline:2px solid var(--peach);
      outline-offset:-2px;
      z-index:2;
    }
    .workbook-foot{
      display:flex;
      justify-content:space-between;
      gap:18px;
      align-items:center;
      padding:10px 14px;
      border-top:1px solid var(--line-dark);
      background:var(--dark);
      color:#9fa9a1;
      font-size:.68rem;
    }
    .workbook-foot a{
      color:var(--peach);
      text-decoration:none;
      font-weight:700;
    }
    .workbook-foot a:hover{color:#fff}
    .embedded-only{display:none}
    body.is-embedded .shell{width:100%;max-width:none;padding:0}
    body.is-embedded .workbook{
      border:0;
      box-shadow:none;
    }
    body.is-embedded .workbook-top{
      padding:16px 18px 14px;
    }
    body.is-embedded .workbook-top h1{
      font-size:1.25rem;
    }
    body.is-embedded .sheet-stage{
      min-height:760px;
      max-height:900px;
    }
    body.is-embedded .standalone-only{display:none}
    body.is-embedded .embedded-only{display:inline}
    @media(max-width:760px){
      .shell{padding:0}
      .workbook{border-left:0;border-right:0}
      .workbook-top{flex-direction:column}
      .workbook-meta{justify-content:flex-start;text-align:left}
      .sheet-toolbar{align-items:flex-start;flex-direction:column;gap:3px}
      .sheet-status{text-align:left}
      .sheet-stage{min-height:650px;max-height:780px}
      .grid th,.grid td{min-width:84px;max-width:260px}
      .workbook-foot{align-items:flex-start;flex-direction:column}
    }
  </style>
</head>
<body>
<div class="shell">
  <section class="workbook" aria-label="Synthetic workforce analytics workbook">
    <header class="workbook-top">
      <div>
        <p class="workbook-kicker">Interactive workbook</p>
        <h1>Workforce Training Analytics</h1>
      </div>
      <div class="workbook-meta">
        <span>100% synthetic</span>
        <span>Read only</span>
        <span class="standalone-only">Portfolio reconstruction</span>
      </div>
    </header>

    <nav class="sheet-tabs" id="tabs" aria-label="Workbook sheets"></nav>

    <div class="sheet-toolbar">
      <div class="sheet-title">
        <strong id="sheet-name">Loading workbook</strong>
        <span id="sheet-dimensions"></span>
      </div>
      <span class="sheet-status">Click a sheet tab to explore the analysis</span>
    </div>

    <main class="sheet-stage" id="view">
      <div class="loading">Loading workbook…</div>
    </main>

    <footer class="workbook-foot">
      <span>
        <span class="embedded-only">Synthetic workbook viewer · </span>
        Source: WorkforceTrainingAnalytics_Portfolio.xlsx
      </span>
      <span class="standalone-only">
        <a href="../assets/downloads/WorkforceTrainingAnalytics_Portfolio.xlsx" download>Download .xlsx ↗</a>
        &nbsp;&nbsp;
        <a href="training-analytics.html">Return to case study ↗</a>
      </span>
    </footer>
  </section>
</div>

<script>
(function(){
  const embedded = new URLSearchParams(location.search).get("embedded") === "1";
  if (embedded) document.body.classList.add("is-embedded");

  const workbookUrl = "../assets/downloads/WorkforceTrainingAnalytics_Portfolio.xlsx";
  const tabs = document.getElementById("tabs");
  const view = document.getElementById("view");
  const sheetName = document.getElementById("sheet-name");
  const sheetDimensions = document.getElementById("sheet-dimensions");

  function colName(n){
    let s = "";
    while(n >= 0){
      s = String.fromCharCode((n % 26) + 65) + s;
      n = Math.floor(n / 26) - 1;
    }
    return s;
  }

  function esc(value){
    return String(value ?? "").replace(/[&<>"']/g, ch => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    })[ch]);
  }

  function mergeMaps(ws){
    const starts = new Map();
    const covered = new Set();
    (ws["!merges"] || []).forEach(m => {
      const rs = m.s.r, cs = m.s.c, re = m.e.r, ce = m.e.c;
      starts.set(rs + ":" + cs, {rowspan:re-rs+1,colspan:ce-cs+1});
      for(let r=rs;r<=re;r++){
        for(let c=cs;c<=ce;c++){
          if(r!==rs || c!==cs) covered.add(r + ":" + c);
        }
      }
    });
    return {starts,covered};
  }

  function findHeaderRow(rows){
    const limit = Math.min(rows.length, 12);
    let best = -1, bestScore = 0;
    for(let r=0;r<limit;r++){
      const vals = rows[r].filter(v => v !== "" && v != null);
      if(vals.length < 2) continue;
      const strings = vals.filter(v => typeof v === "string").length;
      const score = vals.length + strings * .7;
      if(score > bestScore){ best=r; bestScore=score; }
    }
    return best;
  }

  function renderSheet(wb,name){
    const ws = wb.Sheets[name];
    document.querySelectorAll(".sheet-tab").forEach(btn => {
      const active = btn.dataset.sheet === name;
      btn.classList.toggle("is-active",active);
      btn.setAttribute("aria-selected",String(active));
    });

    sheetName.textContent = name;

    if(!ws["!ref"]){
      sheetDimensions.textContent = "Empty sheet";
      view.innerHTML = '<div class="loading">This worksheet is empty.</div>';
      return;
    }

    const range = XLSX.utils.decode_range(ws["!ref"]);
    const rowCount = range.e.r - range.s.r + 1;
    const colCount = range.e.c - range.s.c + 1;
    sheetDimensions.textContent = rowCount.toLocaleString() + " rows · " + colCount + " columns";

    const maxRows = name.toLowerCase().includes("dataset") ? Math.min(range.e.r, range.s.r + 250) : range.e.r;
    const displayRange = {s:range.s,e:{r:maxRows,c:range.e.c}};
    const merges = mergeMaps(ws);

    const formattedRows = XLSX.utils.sheet_to_json(ws,{
      header:1,
      range:displayRange,
      defval:"",
      raw:false,
      blankrows:true
    });
    const headerIndexLocal = findHeaderRow(formattedRows);
    const headerRow = headerIndexLocal < 0 ? -1 : range.s.r + headerIndexLocal;

    let html = '<table class="grid" role="grid"><thead><tr><th class="corner"></th>';
    for(let c=range.s.c;c<=range.e.c;c++){
      html += '<th class="col-head" scope="col">' + colName(c) + '</th>';
    }
    html += '</tr></thead><tbody>';

    for(let r=range.s.r;r<=maxRows;r++){
      let nonEmpty=0;
      for(let c=range.s.c;c<=range.e.c;c++){
        const cell=ws[XLSX.utils.encode_cell({r,c})];
        if(cell && cell.v !== undefined && cell.v !== "") nonEmpty++;
      }
      const sectionRow = nonEmpty===1 && r!==headerRow;
      html += '<tr' + (r===headerRow?' class="data-header"':sectionRow?' class="section-row"':'') + '>';
      html += '<th class="row-head" scope="row">' + (r+1) + '</th>';

      for(let c=range.s.c;c<=range.e.c;c++){
        const key=r+":"+c;
        if(merges.covered.has(key)) continue;

        const cell=ws[XLSX.utils.encode_cell({r,c})];
        const merge=merges.starts.get(key);
        let value="";
        if(cell){
          value = cell.w !== undefined ? cell.w : cell.v;
          if(value instanceof Date) value=value.toLocaleDateString();
        }

        const classes=[];
        if(cell && cell.t==="n") classes.push("is-number");
        if(cell && cell.t==="b") classes.push("is-boolean");
        if(nonEmpty===1 && value!=="") classes.push("title-cell");

        html += '<td tabindex="0"' +
          (classes.length?' class="'+classes.join(" ")+'"':'') +
          (merge && merge.rowspan>1?' rowspan="'+merge.rowspan+'"':'') +
          (merge && merge.colspan>1?' colspan="'+merge.colspan+'"':'') +
          '>' + esc(value) + '</td>';
      }
      html += '</tr>';
    }

    html += '</tbody></table>';

    if(maxRows < range.e.r){
      html += '<div style="padding:12px 14px;color:#667069;font-family:var(--serif);font-size:.84rem;font-style:italic;background:#f5f1e7;border-top:1px solid var(--line);">' +
        'Showing the first ' + (maxRows-range.s.r+1).toLocaleString() + ' rows of ' + rowCount.toLocaleString() + '. Download the workbook for the full dataset.' +
        '</div>';
    }

    view.innerHTML=html;
  }

  async function init(){
    try{
      if(!window.XLSX) throw new Error("Workbook library did not load.");
      const response=await fetch(workbookUrl,{cache:"no-store"});
      if(!response.ok) throw new Error("Workbook could not be loaded.");
      const data=await response.arrayBuffer();
      const wb=XLSX.read(data,{type:"array",cellDates:true,cellStyles:true,cellNF:true,cellText:true});

      if(!wb.SheetNames.length) throw new Error("The workbook contains no worksheets.");

      tabs.innerHTML="";
      wb.SheetNames.forEach((name,index)=>{
        const btn=document.createElement("button");
        btn.type="button";
        btn.className="sheet-tab"+(index===0?" is-active":"");
        btn.dataset.sheet=name;
        btn.setAttribute("role","tab");
        btn.setAttribute("aria-selected",String(index===0));
        btn.textContent=name;
        btn.addEventListener("click",()=>renderSheet(wb,name));
        tabs.appendChild(btn);
      });

      const preferred =
        wb.SheetNames.find(n => /executive|dashboard/i.test(n)) ||
        wb.SheetNames[0];
      renderSheet(wb,preferred);
    }catch(err){
      view.innerHTML='<div class="error"><div><strong>Workbook viewer unavailable.</strong>' +
        'The synthetic workbook can still be downloaded from the case study.</div></div>';
      sheetName.textContent="Workbook unavailable";
      sheetDimensions.textContent="";
    }
  }

  init();
})();
</script>
</body>
</html>
